name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project JevJarvis.xcodeproj \
            -target JevJarvis \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Fake-sign with entitlements
        run: |
          APP_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos/JevJarvis.app"
          echo "APP_DIR=$APP_DIR"
          test -d "$APP_DIR"
          ls "$APP_DIR"
          ls "$APP_DIR/PlugIns"
          cat > /tmp/app.entitlements << 'ENT_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>JEVFAKE123.com.jevchat.jarvis</string>
              <key>com.apple.security.application-groups</key>
              <array><string>group.com.jevchat.jarvis</string></array>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          ENT_EOF
          cat > /tmp/keyboard.entitlements << 'ENT_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>application-identifier</key>
              <string>JEVFAKE123.com.jevchat.jarvis.keyboard</string>
              <key>com.apple.security.application-groups</key>
              <array><string>group.com.jevchat.jarvis</string></array>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          ENT_EOF
          ldid -S/tmp/app.entitlements "$APP_DIR/JevJarvis"
          ldid -S/tmp/keyboard.entitlements "$APP_DIR/PlugIns/JevKeyboard.appex/JevKeyboard"
          echo "signing done"

      - name: Package IPA
        run: |
          APP_DIR="$GITHUB_WORKSPACE/build/Release-iphoneos/JevJarvis.app"
          mkdir -p /tmp/ipa/Payload
          cp -R "$APP_DIR" /tmp/ipa/Payload/
          cd /tmp/ipa && zip -qr "$GITHUB_WORKSPACE/JevJarvis-unsigned.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/JevJarvis-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JevJarvis-unsigned-ipa
          path: JevJarvis-unsigned.ipa
